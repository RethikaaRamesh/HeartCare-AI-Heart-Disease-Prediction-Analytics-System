<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}HeartCare AI{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>❤️ HeartCare AI</h2>
            <p>Healthcare Analytics</p>
        </div>

        <nav>

            <a href="/"
               class="nav-link-custom {% if active_page == 'prediction' %}active-link{% endif %}">
                🏠 Prediction
            </a>

            <a href="/dashboard"
               class="nav-link-custom {% if active_page == 'dashboard' %}active-link{% endif %}">
                📊 Dashboard
            </a>

            <a href="/analytics"
               class="nav-link-custom {% if active_page == 'analytics' %}active-link{% endif %}">
                📈 Analytics
            </a>

            <a href="/history"
               class="nav-link-custom {% if active_page == 'history' %}active-link{% endif %}">
                🗂 History
            </a>

            <a href="/reports"
               class="nav-link-custom {% if active_page == 'reports' %}active-link{% endif %}">
                📄 Reports
            </a>

        </nav>

    </aside>

    <!-- Main Content -->
    <main class="main">

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>

</html>
